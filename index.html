<!DOCTYPE html>
<html>
<head>
    <title>Prabhu Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: auto;
            padding: 20px;
            background: #f2f2f2;
            font-size: 18px;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
            font-size: 36px;
        }

        h2 {
            font-size: 26px;
        }

        .post {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        .post img {
            width: 70%;
            max-width: 400px;
            display: block;
            margin: 20px auto;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Prabhu Blog</h1>

    <div class="post">
        <h2>My First Blog Post</h2>

        <p>
            Welcome to my blog! This is my first post.
            I will share my projects, ideas and photos here.
        </p>
    </div>

    <div class="post">

        <h2>My First Project</h2>

        <img src="images/IMG_20251005_081120.jpg" alt="My Project">

        <p>
            Today I started working on a new project.
        </p>

    </div>

</body>
</html>
